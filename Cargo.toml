[package]
name = "shinobi-optimizer"
version = "0.1.0"
edition = "2024"
default_run = "optim"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
raylib = { version = "5.5.0", features = [] }
serde_json = "1.0.149"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "optim"
path = "src/optimised.rs"
